# Application validation precedes the shared infrastructure publishing contract.
name: Publish image
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/check.yml
  pillbox:
    needs: validate
    uses: crvouga/personal/.github/workflows/ci.yml@main
    secrets:
      CALLER_GITHUB_TOKEN: ${{ github.token }}
    with:
      service_id: pillbox
      dockerfile: ./Dockerfile
      context: .
      image_owner: crvouga
      image_prefix: chrisvouga
      infra_github_repo: crvouga/personal
      notify_deploy: false
